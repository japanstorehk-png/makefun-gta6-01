<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solara Keys</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1018; color: #eef1f5; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
    #hint { position: fixed; left: 12px; bottom: 10px; font-size: 12px; color: #8fa3bf; opacity: 0.85; pointer-events: none; user-select: none; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Solara Keys: an open-world crime game set in Costa Luna"></canvas>
  <div id="hint" aria-hidden="true">Solara Keys · offline prototype</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
